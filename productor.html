<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA MOMENTS — Productor</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050505;
            color: #ffffff;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 18px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;
            margin: 22px 0 30px;
        }

        .logo-nova {
            font-family: "Montserrat", sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 5px;
        }

        .logo-subtitle {
            margin-top: 7px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #777777;
            text-transform: uppercase;
        }


        /* =========================
           LOGIN
        ========================= */

        #loginSection {
            max-width: 420px;
            margin: 0 auto;
        }

        .login-card {
            background: #0d0d0d;
            border: 1px solid #202020;
            border-radius: 18px;
            padding: 28px;
        }

        .login-title {
            margin: 0 0 8px;
            font-family: "Montserrat", sans-serif;
            font-size: 21px;
            font-weight: 600;
        }

        .login-description {
            margin: 0 0 25px;
            color: #888888;
            font-size: 13px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #aaaaaa;
            font-size: 12px;
        }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #292929;
            border-radius: 10px;
            background: #070707;
            color: #ffffff;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            outline: none;
        }

        .field input:focus {
            border-color: #555555;
        }

        .login-button {
            width: 100%;
            height: 50px;
            margin-top: 7px;
            border: none;
            border-radius: 10px;
            background: #ffffff;
            color: #000000;
            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border: 1px solid #3a2020;
            border-radius: 9px;
            background: #160909;
            color: #d8a0a0;
            font-size: 12px;
            text-align: center;
        }


        /* =========================
           PANEL
        ========================= */

        #productorPanel {
            display: none;
        }

        .panel-header {
            margin-bottom: 22px;
        }

        .panel-title {
            margin: 0;
            font-family: "Montserrat", sans-serif;
            font-size: 24px;
            font-weight: 600;
        }

        .panel-subtitle {
            margin: 7px 0 0;
            color: #777777;
            font-size: 12px;
        }


        /* =========================
           RESUMEN
        ========================= */

        .resumen {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .resumen-card {
            padding: 16px;
            border: 1px solid #202020;
            border-radius: 14px;
            background: #0d0d0d;
        }

        .resumen-label {
            color: #777777;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .resumen-value {
            margin-top: 8px;
            font-family: "Montserrat", sans-serif;
            font-size: 21px;
            font-weight: 600;
        }


        /* =========================
           ESTADO
        ========================= */

        .mensaje {
            display: none;
            margin-bottom: 18px;
            padding: 13px 14px;
            border: 1px solid #202020;
            border-radius: 10px;
            background: #0d0d0d;
            color: #999999;
            font-size: 12px;
            text-align: center;
        }


        /* =========================
           PEDIDOS
        ========================= */

        .pedidos {
            display: grid;
            gap: 13px;
        }

        .pedido {
            padding: 18px;
            border: 1px solid #202020;
            border-radius: 16px;
            background: #0d0d0d;
        }

        .pedido-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 15px;
        }

        .pedido-id {
            font-family: "Montserrat", sans-serif;
            font-size: 15px;
            font-weight: 600;
        }

        .pedido-fecha {
            margin-top: 5px;
            color: #666666;
            font-size: 10px;
        }

        .estado-pago {
            padding: 6px 9px;
            border: 1px solid #292929;
            border-radius: 7px;
            background: #181818;
            color: #cccccc;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .7px;
            text-transform: uppercase;
        }

        .estado-aprobado {
            border-color: #29422e;
            background: #0c170f;
            color: #a8d6b0;
        }

        .estado-pendiente {
            border-color: #403a22;
            background: #151309;
            color: #d6c58e;
        }

        .estado-rechazado {
            border-color: #432626;
            background: #180b0b;
            color: #d9a0a0;
        }

        .pedido-cliente {
            margin-bottom: 15px;
        }

        .cliente-nombre {
            font-size: 14px;
            font-weight: 600;
        }

        .cliente-evento {
            margin-top: 4px;
            color: #777777;
            font-size: 11px;
        }

        .pedido-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 13px;
            border-top: 1px solid #1d1d1d;
        }

        .total-label {
            color: #777777;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-value {
            font-family: "Montserrat", sans-serif;
            font-size: 18px;
            font-weight: 600;
        }

        .ver-pedido {
            width: 100%;
            height: 43px;
            margin-top: 14px;
            border: 1px solid #292929;
            border-radius: 9px;
            background: #111111;
            color: #ffffff;
            font-family: "Inter", sans-serif;
            font-size: 11px;
            cursor: pointer;
        }

        .ver-pedido:hover {
            background: #181818;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 18px;
            background: rgba(0,0,0,.82);
            overflow-y: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #292929;
            border-radius: 17px;
            background: #0d0d0d;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-title {
            margin: 0;
            font-family: "Montserrat", sans-serif;
            font-size: 18px;
        }

        .cerrar {
            width: 34px;
            height: 34px;
            border: 1px solid #292929;
            border-radius: 8px;
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        .detalle {
            display: grid;
            gap: 9px;
            margin-bottom: 20px;
        }

        .detalle-row {
            padding: 12px;
            border-radius: 9px;
            background: #080808;
        }

        .detalle-label {
            margin-bottom: 5px;
            color: #666666;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .detalle-value {
            color: #dddddd;
            font-size: 12px;
            word-break: break-word;
        }

        .fotos-title {
            margin: 20px 0 8px;
            color: #888888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .foto {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 11px 0;
            border-top: 1px solid #1c1c1c;
            color: #cccccc;
            font-size: 11px;
        }

        .foto-precio {
            color: #777777;
            white-space: nowrap;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin: 30px 0 15px;
            color: #444444;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 14px;
            }

            .logo {
                margin: 18px 0 25px;
            }

            .logo-nova {
                font-size: 25px;
            }

            .login-card {
                padding: 24px 20px;
            }

            .resumen {
                grid-template-columns: 1fr 1fr;
            }

            .pedido {
                padding: 16px;
            }

            .modal-card {
                margin: 20px auto;
            }

        }

    </style>

</head>


<body>

<main class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">

        <div class="logo-nova">
            NOVA
        </div>

        <div class="logo-subtitle">
            Moments
        </div>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <section id="loginSection">

        <div class="login-card">

            <h1 class="login-title">
                Productor
            </h1>

            <p class="login-description">
                Acceso privado a pedidos de NOVA MOMENTS.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    INGRESAR
                </button>


                <div
                    class="error"
                    id="loginError"
                ></div>

            </form>

        </div>

    </section>


    <!-- =========================
         PANEL PRODUCTOR
    ========================== -->

    <section id="productorPanel">

        <div class="panel-header">

            <h1 class="panel-title">
                Pedidos
            </h1>

            <p class="panel-subtitle">
                Pedidos registrados en NOVA MOMENTS.
            </p>

        </div>


        <div class="resumen">

            <div class="resumen-card">

                <div class="resumen-label">
                    Pedidos
                </div>

                <div
                    class="resumen-value"
                    id="cantidadPedidos"
                >
                    0
                </div>

            </div>


            <div class="resumen-card">

                <div class="resumen-label">
                    Pagados
                </div>

                <div
                    class="resumen-value"
                    id="cantidadPagados"
                >
                    0
                </div>

            </div>

        </div>


        <div
            class="mensaje"
            id="mensaje"
        ></div>


        <div
            class="pedidos"
            id="pedidosContainer"
        ></div>

    </section>


    <div class="footer">
        NOVA MOMENTS
    </div>


</main>


<!-- =========================
     MODAL DETALLE
========================== -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="modalTitulo"
            >
                Pedido
            </h2>

            <button
                type="button"
                class="cerrar"
                id="cerrarModal"
            >
                ×
            </button>

        </div>


        <div
            class="detalle"
            id="detallePedido"
        ></div>


        <div class="fotos-title">
            Fotografías seleccionadas
        </div>


        <div
            id="fotosPedido"
        ></div>

    </div>

</div>


<script>


    /*
    =========================================================
    NOVA MOMENTS — PRODUCTOR
    Primera versión
    =========================================================
    */


    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const loginError =
        document.getElementById(
            "loginError"
        );


    const loginSection =
        document.getElementById(
            "loginSection"
        );


    const productorPanel =
        document.getElementById(
            "productorPanel"
        );


    const pedidosContainer =
        document.getElementById(
            "pedidosContainer"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    const cantidadPedidos =
        document.getElementById(
            "cantidadPedidos"
        );


    const cantidadPagados =
        document.getElementById(
            "cantidadPagados"
        );


    const modal =
        document.getElementById(
            "modal"
        );


    const modalTitulo =
        document.getElementById(
            "modalTitulo"
        );


    const detallePedido =
        document.getElementById(
            "detallePedido"
        );


    const fotosPedido =
        document.getElementById(
            "fotosPedido"
        );


    const cerrarModal =
        document.getElementById(
            "cerrarModal"
        );


    let usuarioProductor = "";

    let passwordProductor = "";

    let pedidosActuales = [];


    /*
    =========================================================
    DINERO
    =========================================================
    */

    function formatearDinero(valor) {

        return new Intl.NumberFormat(
            "es-AR",
            {
                style: "currency",
                currency: "ARS",
                maximumFractionDigits: 0
            }
        ).format(
            Number(valor) || 0
        );

    }


    /*
    =========================================================
    FECHA
    =========================================================
    */

    function formatearFecha(valor) {

        if (!valor) {
            return "Sin fecha";
        }

        try {

            return new Date(valor)
                .toLocaleString(
                    "es-AR",
                    {
                        dateStyle: "short",
                        timeStyle: "short"
                    }
                );

        } catch {

            return valor;

        }

    }


    /*
    =========================================================
    ESTADO PAGO
    =========================================================
    */

    function obtenerClaseEstado(estado) {

        const valor =
            String(
                estado || ""
            ).toLowerCase();


        if (
            valor === "approved" ||
            valor === "aprobado"
        ) {

            return "estado-aprobado";

        }


        if (
            valor === "rejected" ||
            valor === "rechazado" ||
            valor === "cancelled"
        ) {

            return "estado-rechazado";

        }


        return "estado-pendiente";

    }


    function obtenerTextoEstado(estado) {

        const valor =
            String(
                estado || ""
            ).toLowerCase();


        if (
            valor === "approved" ||
            valor === "aprobado"
        ) {

            return "PAGO APROBADO";

        }


        if (
            valor === "rejected" ||
            valor === "rechazado"
        ) {

            return "PAGO RECHAZADO";

        }


        if (
            valor === "cancelled"
        ) {

            return "PAGO CANCELADO";

        }


        return "PAGO PENDIENTE";

    }


    /*
    =========================================================
    MOSTRAR PEDIDOS
    =========================================================
    */

    function mostrarPedidos(pedidos) {

        pedidosActuales =
            Array.isArray(pedidos)
                ? pedidos
                : [];


        pedidosContainer.innerHTML =
            "";


        cantidadPedidos.textContent =
            pedidosActuales.length;


        const pagados =
            pedidosActuales.filter(
                function (pedido) {

                    const estado =
                        String(
                            pedido.estado_pago || ""
                        ).toLowerCase();

                    return estado === "approved";

                }
            ).length;


        cantidadPagados.textContent =
            pagados;


        if (
            pedidosActuales.length === 0
        ) {

            pedidosContainer.innerHTML = `
                <div class="mensaje"
                     style="display:block;">
                    No hay pedidos registrados.
                </div>
            `;

            return;

        }


        pedidosActuales.forEach(
            function (pedido, indice) {

                const estado =
                    pedido.estado_pago ||
                    pedido.estado ||
                    "pendiente";


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "pedido";


                card.innerHTML = `

                    <div class="pedido-top">

                        <div>

                            <div class="pedido-id">
                                ${
                                    pedido.pedido_id ||
                                    "Pedido"
                                }
                            </div>

                            <div class="pedido-fecha">
                                ${
                                    formatearFecha(
                                        pedido.creado_en
                                    )
                                }
                            </div>

                        </div>

                        <div
                            class="estado-pago ${
                                obtenerClaseEstado(
                                    estado
                                )
                            }"
                        >
                            ${
                                obtenerTextoEstado(
                                    estado
                                )
                            }
                        </div>

                    </div>


                    <div class="pedido-cliente">

                        <div class="cliente-nombre">
                            ${
                                pedido.nombre ||
                                "Cliente sin nombre"
                            }
                        </div>

                        <div class="cliente-evento">
                            Evento:
                            ${
                                pedido.evento_id ||
                                "—"
                            }
                        </div>

                    </div>


                    <div class="pedido-total">

                        <div class="total-label">
                            Total
                        </div>

                        <div class="total-value">
                            ${
                                formatearDinero(
                                    pedido.total
                                )
                            }
                        </div>

                    </div>


                    <button
                        type="button"
                        class="ver-pedido"
                        data-indice="${indice}"
                    >
                        VER PEDIDO
                    </button>

                `;


                pedidosContainer.appendChild(
                    card
                );

            }
        );


        document
            .querySelectorAll(
                ".ver-pedido"
            )
            .forEach(
                function (boton) {

                    boton.addEventListener(
                        "click",
                        function () {

                            const indice =
                                Number(
                                    boton.dataset.indice
                                );


                            abrirPedido(
                                pedidosActuales[
                                    indice
                                ]
                            );

                        }
                    );

                }
            );

    }


    /*
    =========================================================
    ABRIR PEDIDO
    =========================================================
    */

    function abrirPedido(pedido) {

        if (!pedido) {
            return;
        }


        modalTitulo.textContent =
            pedido.pedido_id ||
            "Pedido";


        detallePedido.innerHTML = `

            <div class="detalle-row">

                <div class="detalle-label">
                    Cliente
                </div>

                <div class="detalle-value">
                    ${
                        pedido.nombre || "—"
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    WhatsApp
                </div>

                <div class="detalle-value">
                    ${
                        pedido.whatsapp || "—"
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    Email
                </div>

                <div class="detalle-value">
                    ${
                        pedido.email || "—"
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    Evento
                </div>

                <div class="detalle-value">
                    ${
                        pedido.evento_id || "—"
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    Estado del pago
                </div>

                <div class="detalle-value">
                    ${
                        obtenerTextoEstado(
                            pedido.estado_pago
                        )
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    Fecha
                </div>

                <div class="detalle-value">
                    ${
                        formatearFecha(
                            pedido.creado_en
                        )
                    }
                </div>

            </div>


            <div class="detalle-row">

                <div class="detalle-label">
                    Total
                </div>

                <div class="detalle-value">
                    ${
                        formatearDinero(
                            pedido.total
                        )
                    }
                </div>

            </div>

        `;


        fotosPedido.innerHTML =
            "";


        const items =
            Array.isArray(
                pedido.items
            )
                ? pedido.items
                : [];


        if (
            items.length === 0
        ) {

            fotosPedido.innerHTML = `
                <div class="foto">
                    <div>
                        No hay fotografías registradas.
                    </div>
                </div>
            `;

        } else {

            items.forEach(
                function (item) {

                    const fila =
                        document.createElement(
                            "div"
                        );


                    fila.className =
                        "foto";


                    fila.innerHTML = `

                        <div>
                            ${
                                item.nombre_archivo ||
                                item.foto_id ||
                                "Foto"
                            }

                            ×
                            ${
                                item.cantidad || 0
                            }
                        </div>

                        <div class="foto-precio">
                            ${
                                formatearDinero(
                                    item.subtotal
                                )
                            }
                        </div>

                    `;


                    fotosPedido.appendChild(
                        fila
                    );

                }
            );

        }


        modal.style.display =
            "block";

        document.body.style.overflow =
            "hidden";

    }


    /*
    =========================================================
    CERRAR MODAL
    =========================================================
    */

    function cerrarDetalle() {

        modal.style.display =
            "none";

        document.body.style.overflow =
            "";

    }


    cerrarModal.addEventListener(
        "click",
        cerrarDetalle
    );


    modal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === modal
            ) {

                cerrarDetalle();

            }

        }
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {

                cerrarDetalle();

            }

        }
    );


    /*
    =========================================================
    CARGAR PEDIDOS
    =========================================================
    */

    async function cargarPedidos() {

        mensaje.style.display =
            "block";

        mensaje.textContent =
            "Consultando pedidos...";


        try {

            const respuesta =
                await fetch(
                    "/api/admin-pedidos",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                usuario:
                                    usuarioProductor,

                                password:
                                    passwordProductor

                            })

                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !datos.ok
            ) {

                throw new Error(
                    datos.error ||
                    "No se pudieron cargar los pedidos."
                );

            }


            mensaje.style.display =
                "none";


            mostrarPedidos(
                datos.pedidos
            );


        } catch (error) {

            mensaje.style.display =
                "block";

            mensaje.textContent =
                error.message ||
                "Error al consultar los pedidos.";

        }

    }


    /*
    =========================================================
    LOGIN
    =========================================================
    */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            loginError.style.display =
                "none";


            loginButton.disabled =
                true;

            loginButton.textContent =
                "VERIFICANDO...";


            const usuario =
                document
                    .getElementById(
                        "usuario"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            try {

                const respuesta =
                    await fetch(
                        "/api/admin-login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:
                                "include",

                            body:
                                JSON.stringify({

                                    usuario:
                                        usuario,

                                    password:
                                        password

                                })

                        }
                    );


                const datos =
                    await respuesta.json();


                if (
                    !respuesta.ok ||
                    !datos.ok
                ) {

                    throw new Error(
                        datos.error ||
                        "Usuario o contraseña incorrectos."
                    );

                }


                usuarioProductor =
                    usuario;

                passwordProductor =
                    password;


                loginSection.style.display =
                    "none";

                productorPanel.style.display =
                    "block";


                await cargarPedidos();


            } catch (error) {

                loginError.textContent =
                    error.message ||
                    "No se pudo conectar con NOVA.";

                loginError.style.display =
                    "block";


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "INGRESAR";

            }

        }
    );


</script>
