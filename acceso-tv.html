
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA TV - Acceso</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #080a0e;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.panel {
  width: 100%;
  max-width: 560px;
  padding: 38px;
  background: #151922;
  border: 1px solid #45403a;
  border-radius: 10px;
}
.logo {
  color: #d8bd8a;
  font-size: 38px;
  font-weight: normal;
  letter-spacing: 10px;
  text-align: center;
}
.subtitle {
  color: #bfc3cb;
  text-align: center;
  margin: 12px 0 32px;
  font-size: 17px;
}
label {
  display: block;
  margin: 22px 0 10px;
  font-size: 19px;
}
input {
  width: 100%;
  height: 58px;
  padding: 12px;
  border-radius: 5px;
  border: 2px solid #555b66;
  background: #090c12;
  color: white;
  font-size: 21px;
}
button, .back {
  display: block;
  width: 100%;
  min-height: 58px;
  margin-top: 24px;
  padding: 15px;
  border: 2px solid #d8bd8a;
  border-radius: 5px;
  background: #d8bd8a;
  color: #11151b;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.back {
  background: transparent;
  color: white;
  border-color: #555b66;
}
input:focus, button:focus, a:focus {
  outline: 4px solid #fff0c9;
  outline-offset: 4px;
}
#mensaje {
  min-height: 28px;
  margin-top: 20px;
  color: #ffd3a3;
  font-size: 17px;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="panel">
  <div class="logo">NOVA</div>
  <div class="subtitle">Ingresá a tus recuerdos</div>

  <form id="formulario">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario"
      type="text" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password"
      type="password" autocomplete="current-password" required>

    <button id="ingresar" type="submit">INGRESAR</button>
    <div id="mensaje" role="status"></div>
  </form>

  <a class="back" href="nova-tv.html">VOLVER A NOVA TV</a>
</div>

<script>
(function () {
  var formulario = document.getElementById("formulario");
  var boton = document.getElementById("ingresar");
  var mensaje = document.getElementById("mensaje");

  formulario.onsubmit = function (e) {
    if (e && e.preventDefault) {
      e.preventDefault();
    }

    var usuario = document.getElementById("usuario").value;
    var password = document.getElementById("password").value;

    usuario = usuario.replace(/^\s+|\s+$/g, "");
    password = password.replace(/^\s+|\s+$/g, "");

    if (!usuario || !password) {
      mensaje.innerHTML = "Ingresá tu usuario y contraseña.";
      return false;
    }

    boton.disabled = true;
    mensaje.innerHTML = "Verificando acceso...";

    var solicitud = new XMLHttpRequest();

    solicitud.open("POST", "/api/login", true);
    solicitud.setRequestHeader(
      "Content-Type", "application/json"
    );

    solicitud.onreadystatechange = function () {
      if (solicitud.readyState !== 4) {
        return;
      }

      boton.disabled = false;

      if (solicitud.status < 200 ||
          solicitud.status >= 300) {
        mensaje.innerHTML =
          "No se pudo ingresar. Revisá los datos e intentá nuevamente.";
        return;
      }

      var datos;

      try {
        datos = JSON.parse(solicitud.responseText);
      } catch (error) {
        mensaje.innerHTML =
          "El servidor devolvió una respuesta no válida.";
        return;
      }

      if (!datos.ok) {
        mensaje.innerHTML =
          datos.error || "Usuario o contraseña incorrectos.";
        return;
      }

      try {
        localStorage.setItem("nova_usuario", usuario);
        localStorage.setItem("nova_evento", datos.evento);
      } catch (error) {
        mensaje.innerHTML =
          "El navegador no permite guardar la sesión.";
        return;
      }

      if (datos.tipo_experiencia === "VENTA") {
        window.location.href = "experiencia-venta.html";
      } else {
        window.location.href = "experiencia.html";
      }
    };

    solicitud.onerror = function () {
      boton.disabled = false;
      mensaje.innerHTML =
        "Error de conexión. Revisá la conexión del televisor.";
    };

    try {
      solicitud.send(JSON.stringify({
        usuario: usuario,
        password: password
      }));
    } catch (error) {
      boton.disabled = false;
      mensaje.innerHTML =
        "El navegador no pudo enviar el acceso.";
    }

    return false;
  };
})();
</script>
</body>
</html>
