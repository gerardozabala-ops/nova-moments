<!DOCTYPE html>

<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA MOMENTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
background:#101010;
color:#fff;
font-family:'Inter',Arial,sans-serif;
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
width:100%;
height:70px;
padding:0 45px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(10,10,10,.88);
backdrop-filter:blur(10px);
border-bottom:1px solid #222;
z-index:100;
}

.logo{
color:#fff;
text-decoration:none;
display:flex;
flex-direction:column;
}

.logo-nova{
font-size:20px;
letter-spacing:6px;
}

.logo-moments{
margin-top:4px;
font-size:8px;
letter-spacing:5px;
color:#888;
}

.logout{
background:transparent;
color:#fff;
border:1px solid #666;
padding:8px 18px;
border-radius:20px;
font-size:10px;
cursor:pointer;
transition:.2s;
}

.logout:hover{
background:#fff;
color:#111;
}

/* HERO */

.hero{
position:relative;
min-height:78vh;
display:flex;
align-items:flex-end;
background:#181818 center/cover no-repeat;
}

.hero:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(0,0,0,.05) 20%,
rgba(0,0,0,.35) 55%,
rgba(0,0,0,.96) 100%
);
}

.hero-content{
position:relative;
z-index:2;
width:100%;
padding:70px 7% 65px;
}

.label{
font-size:10px;
letter-spacing:4px;
color:#aaa;
margin-bottom:15px;
}

.client-name{
font-family:Georgia,serif;
font-size:clamp(42px,6vw,72px);
font-weight:400;
line-height:1.1;
}

.event-name{
margin-top:14px;
color:#ddd;
font-size:15px;
letter-spacing:2px;
}

.event-date{
margin-top:9px;
color:#888;
font-size:12px;
}

/* CONTENIDO */

main{
padding:65px 6%;
}

.section{
margin-bottom:70px;
}

.section-title{
font-size:12px;
letter-spacing:3px;
color:#ccc;
margin-bottom:22px;
}

/* FOTOS */

.photo-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.photo{
position:relative;
aspect-ratio:4/3;
overflow:hidden;
background:#1b1b1b;
cursor:pointer;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .4s ease,opacity .4s ease;
}

.photo:hover img{
transform:scale(1.05);
}

.photo:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.18),
transparent
);
pointer-events:none;
}

/* VIDEOS */

.video-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.video{
position:relative;
aspect-ratio:16/9;
overflow:hidden;
background:#1b1b1b;
cursor:pointer;
}

.video video{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.play{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:52px;
height:52px;
border:1px solid rgba(255,255,255,.75);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.35);
font-size:16px;
padding-left:3px;
pointer-events:none;
}

/* SIN CONTENIDO */

.empty{
padding:35px 20px;
border:1px solid #292929;
color:#666;
text-align:center;
font-size:12px;
grid-column:1/-1;
}

/* FOOTER */

footer{
padding:40px;
text-align:center;
color:#444;
border-top:1px solid #222;
font-size:9px;
letter-spacing:2px;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
display:none;
align-items:center;
justify-content:center;
padding:30px;
z-index:500;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:95vw;
max-height:90vh;
object-fit:contain;
}

.close-lightbox{
position:absolute;
top:20px;
right:25px;
width:42px;
height:42px;
border:0;
background:transparent;
color:#fff;
font-size:32px;
cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:900px){

.photo-grid{
grid-template-columns:repeat(3,1fr);
}

.video-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:650px){

header{
height:62px;
padding:0 18px;
}

.logo-nova{
font-size:17px;
}

.logo-moments{
font-size:7px;
}

.logout{
padding:7px 14px;
font-size:9px;
}

.hero{
min-height:70vh;
}

.hero-content{
padding:50px 24px;
}

.client-name{
font-size:45px;
}

.event-name{
font-size:13px;
}

main{
padding:45px 16px;
}

.section{
margin-bottom:55px;
}

.photo-grid{
grid-template-columns:repeat(2,1fr);
gap:6px;
}

.video-grid{
grid-template-columns:1fr;
gap:10px;
}

}

@media(max-width:380px){

.client-name{
font-size:38px;
}

.photo-grid{
grid-template-columns:1fr 1fr;
}

}
</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
<span class="logo-nova">NOVA</span>
<span class="logo-moments">MOMENTS</span>
</a>

<button class="logout" id="logout">
CERRAR SESIÓN
</button>

</header>

<section class="hero" id="hero">

<div class="hero-content">

<div class="label">
NOVA MOMENTS
</div>

<h1 class="client-name" id="nombre">
Cargando...
</h1>

<div class="event-name" id="evento"></div>

<div class="event-date" id="fecha"></div>

</div>

</section>

<main>

<section class="section">

<h2 class="section-title">
FOTOGRAFÍAS
</h2>

<div class="photo-grid" id="fotos"></div>

</section>

<section class="section">

<h2 class="section-title">
VIDEOS
</h2>

<div class="video-grid" id="videos"></div>

</section>

</main>

<footer>
NOVA MOMENTS
</footer>

<div class="lightbox" id="lightbox">

<button
class="close-lightbox"
id="cerrar"
aria-label="Cerrar"

>

× </button>

<img id="imagen" src="" alt="Fotografía">

</div>

<!-- DATOS DE CLIENTES -->

<script src="js/clientes.js?v=4"></script>

<script>

(async function(){

/* ================================
   SESIÓN
================================ */

const usuario =
sessionStorage.getItem("nova_usuario");

const id =
sessionStorage.getItem("nova_evento");


if(!usuario || !id){

location.href="acceso.html";
return;

}


/* ================================
   INFORMACIÓN DEL CLIENTE
================================ */

const cliente =
typeof EVENTOS !== "undefined"
? EVENTOS[id]
: null;


document.getElementById("nombre").textContent =
cliente?.nombre || id;

document.getElementById("evento").textContent =
cliente?.evento || "";

document.getElementById("fecha").textContent =
cliente?.fecha || "";


/* ================================
   CONSULTA A LA API
================================ */

try{

const respuesta =
await fetch(
"/api/contenido?evento="+
encodeURIComponent(id),
{
method:"GET",
cache:"no-store"
}
);


const datos =
await respuesta.json();


if(!respuesta.ok || !datos.ok){

throw new Error(
datos.error ||
"No se pudo obtener el contenido."
);

}


/* ================================
   PORTADA
================================ */

if(
Array.isArray(datos.portada) &&
datos.portada.length
){

const portada =
datos.portada[0];

if(portada.secure_url){

document.getElementById("hero")
.style.backgroundImage =
`url("${portada.secure_url}")`;

}

}


/* ================================
   FOTOGRAFÍAS
================================ */

const fotos =
document.getElementById("fotos");

fotos.innerHTML="";


if(
Array.isArray(datos.fotos) &&
datos.fotos.length
){

datos.fotos.forEach(function(foto){

if(!foto.secure_url)return;


const tarjeta =
document.createElement("div");

tarjeta.className="photo";


const imagen =
document.createElement("img");

imagen.src =
foto.secure_url;

imagen.alt =
"Fotografía del evento";

imagen.loading="lazy";


tarjeta.appendChild(imagen);


tarjeta.onclick=function(){

abrirFoto(
foto.secure_url
);

};


fotos.appendChild(tarjeta);

});

}else{

fotos.innerHTML=
`
<div class="empty">
Todavía no hay fotografías disponibles.
</div>
`;

}


/* ================================
   VIDEOS
================================ */

const videos =
document.getElementById("videos");

videos.innerHTML="";


if(
Array.isArray(datos.videos) &&
datos.videos.length
){

datos.videos.forEach(function(videoData){

if(!videoData.secure_url)return;


const tarjeta =
document.createElement("div");

tarjeta.className="video";


const video =
document.createElement("video");

video.src =
videoData.secure_url;

video.preload="metadata";

video.playsInline=true;

video.muted=true;


tarjeta.appendChild(video);


const play =
document.createElement("div");

play.className="play";

play.textContent="▶";


tarjeta.appendChild(play);


tarjeta.onclick=function(){

if(video.paused){

video.controls=true;

video.muted=false;

video.play();

play.style.display="none";

}else{

video.pause();

}

};


videos.appendChild(tarjeta);

});

}else{

videos.innerHTML=
`
<div class="empty">
Todavía no hay videos disponibles.
</div>
`;

}

}catch(error){

console.error(
"Error cargando contenido:",
error
);


fotos.innerHTML=
`
<div class="empty">
No se pudo cargar el contenido.
</div>
`;

videos.innerHTML=
`
<div class="empty">
No se pudo cargar el contenido.
</div>
`;

}


/* ================================
   LIGHTBOX
================================ */

const lightbox =
document.getElementById("lightbox");

const imagen =
document.getElementById("imagen");


function abrirFoto(url){

imagen.src=url;

lightbox.classList.add("active");

}


function cerrarFoto(){

lightbox.classList.remove("active");

imagen.src="";

}


document
.getElementById("cerrar")
.addEventListener(
"click",
cerrarFoto
);


lightbox.addEventListener(
"click",
function(e){

if(e.target===lightbox){

cerrarFoto();

}

});


document.addEventListener(
"keydown",
function(e){

if(e.key==="Escape"){

cerrarFoto();

}

});


/* ================================
   CERRAR SESIÓN
================================ */

document
.getElementById("logout")
.addEventListener(
"click",
function(){

sessionStorage.removeItem(
"nova_usuario"
);

sessionStorage.removeItem(
"nova_evento"
);

location.href="acceso.html";

});

})();
</script>

</body>
</html>
