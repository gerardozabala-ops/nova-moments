<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA MOMENTS</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#101010;color:#fff;font-family:Arial,sans-serif}
header{height:65px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:#111;border-bottom:1px solid #222;position:fixed;top:0;width:100%;z-index:10}
.logo{color:#fff;text-decoration:none;font-size:20px;letter-spacing:6px}
.logo small{display:block;font-size:7px;letter-spacing:5px;color:#888;margin-top:3px}
button{background:none;color:#fff;border:1px solid #666;border-radius:20px;padding:7px 15px;font-size:10px}
.hero{height:78vh;min-height:450px;background:#181818 center/cover no-repeat;display:flex;align-items:end;position:relative}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.95)}
.info{position:relative;z-index:1;padding:50px 7%;width:100%}
.label{font-size:10px;letter-spacing:4px;color:#aaa}
h1{font:400 clamp(42px,6vw,72px) Georgia,serif;margin:12px 0}
.event{font-size:14px;letter-spacing:2px;color:#ddd}
.date{font-size:12px;color:#888;margin-top:8px}
main{padding:55px 6%}
section{margin-bottom:65px}
h2{font-size:12px;letter-spacing:3px;color:#ccc;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photo{aspect-ratio:4/3;overflow:hidden;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;transition:.3s}
.photo:hover img{transform:scale(1.04)}
.videos{grid-template-columns:repeat(3,1fr)}
.video{position:relative;aspect-ratio:16/9;background:#191919}
.video video{width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #aaa;border-radius:50%;width:50px;height:50px;display:grid;place-items:center}
.empty{border:1px solid #292929;padding:30px;text-align:center;color:#666;grid-column:1/-1;font-size:12px}
footer{text-align:center;padding:35px;border-top:1px solid #222;color:#444;font-size:9px;letter-spacing:2px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;align-items:center;justify-content:center}
.lightbox.active{display:flex}
.lightbox img{max-width:95%;max-height:90%}
.close{position:absolute;right:20px;top:15px;font-size:30px;border:0}

@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.videos{grid-template-columns:1fr}
header{padding:0 18px}
.hero{height:70vh}
.info{padding:40px 24px}
main{padding:45px 16px}
}
</style>

</head>

<body>

<header>
<a href="index.html" class="logo">
NOVA
<small>MOMENTS</small>
</a>
<button id="logout">CERRAR SESIÓN</button>
</header>

<div class="hero" id="hero">
<div class="info">
<div class="label">NOVA MOMENTS</div>
<h1 id="nombre">Cargando...</h1>
<div class="event" id="evento"></div>
<div class="date" id="fecha"></div>
</div>
</div>

<main>

<section>
<h2>FOTOGRAFÍAS</h2>
<div class="grid" id="fotos"></div>
</section>

<section>
<h2>VIDEOS</h2>
<div class="grid videos" id="videos"></div>
</section>

</main>

<footer>NOVA MOMENTS</footer>

<div class="lightbox" id="lightbox">
<button class="close" id="cerrar">×</button>
<img id="imagen">
</div>

<script src="js/clientes.js?v=4"></script>

<script>
(async()=>{

const usuario=sessionStorage.getItem("nova_usuario");
const id=sessionStorage.getItem("nova_evento");

if(!usuario||!id){
location.href="acceso.html";
return;
}

const cliente=typeof EVENTOS!="undefined"?EVENTOS[id]:null;

document.getElementById("nombre").textContent=cliente?.nombre||id;
document.getElementById("evento").textContent=cliente?.evento||"";
document.getElementById("fecha").textContent=cliente?.fecha||"";

try{

const r=await fetch("/api/contenido?evento="+encodeURIComponent(id),{cache:"no-store"});
const d=await r.json();

if(!r.ok||!d.ok)throw Error(d.error||"Error");

if(d.portada?.[0]?.secure_url)
document.getElementById("hero").style.backgroundImage=
`url("${d.portada[0].secure_url}")`;

mostrarFotos(d.fotos);
mostrarVideos(d.videos);

}catch(e){

document.getElementById("fotos").innerHTML=
`<div class="empty">No se pudo cargar el contenido.</div>`;

document.getElementById("videos").innerHTML=
`<div class="empty">No se pudo cargar el contenido.</div>`;

}

})();

function mostrarFotos(fotos){

const caja=document.getElementById("fotos");
caja.innerHTML="";

if(!fotos?.length){
caja.innerHTML='<div class="empty">Todavía no hay fotografías disponibles.</div>';
return;
}

fotos.forEach(f=>{

if(!f.secure_url)return;

const d=document.createElement("div");
d.className="photo";

const img=document.createElement("img");
img.src=f.secure_url;
img.loading="lazy";

d.appendChild(img);

d.onclick=()=>{
document.getElementById("imagen").src=f.secure_url;
document.getElementById("lightbox").classList.add("active");
};

caja.appendChild(d);

});

}

function mostrarVideos(videos){

const caja=document.getElementById("videos");
caja.innerHTML="";

if(!videos?.length){
caja.innerHTML='<div class="empty">Todavía no hay videos disponibles.</div>';
return;
}

videos.forEach(v=>{

if(!v.secure_url)return;

const d=document.createElement("div");
d.className="video";

const video=document.createElement("video");
video.src=v.secure_url;
video.preload="metadata";
video.playsInline=true;

const play=document.createElement("div");
play.className="play";
play.textContent="▶";

d.append(video,play);

d.onclick=()=>{
video.controls=true;
video.play();
play.style.display="none";
};

caja.appendChild(d);

});

}

document.getElementById("cerrar").onclick=()=>{
document.getElementById("lightbox").classList.remove("active");
};

document.getElementById("logout").onclick=()=>{
sessionStorage.clear();
location.href="acceso.html";
};

</script>

</body>
</html>
