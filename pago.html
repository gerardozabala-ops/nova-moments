<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA MOMENTS — Pago</title>


    <!-- =========================
         FUENTES
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         ESTILOS
    ========================== -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #1b1b1b 0%,
                    #0b0b0b 48%,
                    #050505 100%
                );

            color: #ffffff;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }


        .payment-container {

            width: 100%;

            max-width: 520px;
        }


        .brand {

            text-align: center;

            margin-bottom: 30px;
        }


        .brand-name {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 22px;

            font-weight: 600;

            letter-spacing: 4px;
        }


        .brand-subtitle {

            margin-top: 8px;

            font-size: 12px;

            color: #8e8e8e;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .payment-card {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter:
                blur(12px);
        }


        .title {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 24px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .description {

            color: #a0a0a0;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 26px;
        }


        .order-info {

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            padding:
                18px 0;

            margin-bottom: 24px;
        }


        .info-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 12px;

            font-size: 14px;
        }


        .info-row:last-child {

            margin-bottom: 0;
        }


        .info-label {

            color: #8f8f8f;
        }


        .info-value {

            color: #ffffff;

            font-weight: 500;

            text-align: right;

            word-break: break-word;
        }


        .total-row {

            margin-top: 18px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }


        .total-label {

            font-size: 16px;

            font-weight: 500;
        }


        .total-value {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 700;
        }


        .pay-button {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding:
                16px
                20px;

            background:
                #009ee3;

            color: #ffffff;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }


        .pay-button:hover {

            transform:
                translateY(-1px);
        }


        .pay-button:active {

            transform:
                translateY(0);
        }


        .pay-button:disabled {

            opacity: 0.45;

            cursor:
                not-allowed;

            transform:
                none;
        }


        .back-button {

            width: 100%;

            margin-top: 12px;

            padding:
                13px
                18px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 12px;

            background:
                transparent;

            color: #bdbdbd;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 14px;

            cursor: pointer;
        }


        .status {

            margin-top: 20px;

            padding:
                13px
                14px;

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            color: #a8a8a8;

            font-size: 13px;

            line-height: 1.45;

            text-align: center;

            display: none;
        }


        .status.visible {

            display: block;
        }


        .status.error {

            color: #ff8d8d;

            border:
                1px solid
                rgba(
                    255,
                    80,
                    80,
                    0.15
                );
        }


        .loading {

            text-align: center;

            padding:
                24px 0;

            color: #999999;

            font-size: 14px;
        }


        .security-note {

            margin-top: 20px;

            text-align: center;

            color: #666666;

            font-size: 11px;

            line-height: 1.5;
        }


        @media (
            max-width: 480px
        ) {

            body {

                padding: 16px;
            }


            .payment-card {

                padding: 22px;
            }


            .title {

                font-size: 21px;
            }


            .total-value {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <main class="payment-container">


        <div class="brand">

            <div class="brand-name">
                NOVA MOMENTS
            </div>

            <div class="brand-subtitle">
                Pago seguro
            </div>

        </div>


        <section class="payment-card">


            <h1 class="title">
                Confirmar pedido
            </h1>


            <p class="description">
                Revisá el pedido antes de continuar
                al pago.
            </p>


            <div
                id="loading"
                class="loading"
            >
                Cargando pedido...
            </div>


            <div
                id="contenido"
                style="display:none;"
            >


                <div class="order-info">


                    <div class="info-row">

                        <span class="info-label">
                            Pedido
                        </span>

                        <span
                            id="pedidoId"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Evento
                        </span>

                        <span
                            id="eventoId"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Cliente
                        </span>

                        <span
                            id="cliente"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="total-row">

                        <span class="total-label">
                            Total
                        </span>

                        <span
                            id="total"
                            class="total-value"
                        >
                        </span>

                    </div>


                </div>


                <button
                    id="payButton"
                    class="pay-button"
                    type="button"
                    disabled
                >
                    PAGAR CON MERCADO PAGO
                </button>


                <button
                    id="backButton"
                    class="back-button"
                    type="button"
                >
                    VOLVER
                </button>


                <div
                    id="status"
                    class="status"
                >
                </div>


                <div class="security-note">

                    Serás dirigido a Mercado Pago
                    para completar el pago.

                </div>


            </div>


        </section>


    </main>


    <script>


        // =========================
        // ELEMENTOS
        // =========================

        const loading =
            document.getElementById(
                "loading"
            );

        const contenido =
            document.getElementById(
                "contenido"
            );

        const pedidoIdElement =
            document.getElementById(
                "pedidoId"
            );

        const eventoIdElement =
            document.getElementById(
                "eventoId"
            );

        const clienteElement =
            document.getElementById(
                "cliente"
            );

        const totalElement =
            document.getElementById(
                "total"
            );

        const payButton =
            document.getElementById(
                "payButton"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const status =
            document.getElementById(
                "status"
            );


        // =========================
        // OBTENER PEDIDO DE LA URL
        // =========================

        const parametros =
            new URLSearchParams(
                window.location.search
            );

        const pedidoId =
            (
                parametros.get(
                    "pedido"
                ) || ""
            ).trim();


        // =========================
        // ESTADO
        // =========================

        let checkoutUrl =
            null;


        // =========================
        // FORMATEAR DINERO
        // =========================

        function formatearPesos(
            valor
        ) {

            return new Intl.NumberFormat(
                "es-AR",
                {
                    style: "currency",
                    currency: "ARS",
                    maximumFractionDigits: 0
                }
            ).format(
                Number(valor)
            );

        }


        // =========================
        // MOSTRAR ERROR
        // =========================

        function mostrarError(
            mensaje
        ) {

            loading.style.display =
                "none";

            contenido.style.display =
                "block";

            payButton.disabled =
                true;

            status.textContent =
                mensaje;

            status.classList.add(
                "visible",
                "error"
            );

        }


        // =========================
        // CREAR PAGO
        // =========================

        async function cargarPago() {

            if (!pedidoId) {

                mostrarError(
                    "No se indicó ningún pedido."
                );

                return;
            }


            try {

                const respuesta =
                    await fetch(
                        "/api/crear-pago",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    pedido_id:
                                        pedidoId
                                })
                        }
                    );


                const datos =
                    await respuesta.json();


                if (
                    !respuesta.ok ||
                    !datos.ok
                ) {

                    throw new Error(
                        datos.error ||
                        "No se pudo preparar el pago."
                    );

                }


                // =========================
                // MOSTRAR INFORMACIÓN
                // =========================

                pedidoIdElement.textContent =
                    datos.pedido_id ||
                    pedidoId;


                eventoIdElement.textContent =
                    "NOVA MOMENTS";


                clienteElement.textContent =
                    "Pedido confirmado";


                totalElement.textContent =
                    formatearPesos(
                        datos.total
                    );


                // =========================
                // URL DE CHECKOUT
                // =========================
                //
                // Para esta primera prueba
                // utilizamos sandbox.
                // =========================

                checkoutUrl =
                    datos.sandbox_init_point ||
                    null;


                if (!checkoutUrl) {

                    throw new Error(
                        "Mercado Pago no devolvió la URL de prueba."
                    );

                }


                loading.style.display =
                    "none";

                contenido.style.display =
                    "block";

                payButton.disabled =
                    false;


            } catch (error) {

                console.error(
                    "Error preparando pago:",
                    error
                );

                mostrarError(
                    error.message ||
                    "No se pudo preparar el pago."
                );

            }

        }


        // =========================
        // PAGAR
        // =========================

        payButton.addEventListener(
            "click",
            function () {

                if (!checkoutUrl) {

                    return;
                }


                window.location.href =
                    checkoutUrl;

            }
        );


        // =========================
        // VOLVER
        // =========================

        backButton.addEventListener(
            "click",
            function () {

                if (
                    document.referrer &&
                    document.referrer.includes(
                        window.location.origin
                    )
                ) {

                    window.history.back();

                } else {

                    window.location.href =
                        "experiencia-venta.html";

                }

            }
        );


        // =========================
        // INICIAR
        // =========================

        cargarPago();


    </script>


</body>

</html>
