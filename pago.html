<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA MOMENTS — Pago</title>


    <!-- =========================
         FUENTES
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
    >


    <!-- =========================
         MERCADO PAGO SDK
    ========================== -->

    <script src="https://sdk.mercadopago.com/js/v2"></script>


    <!-- =========================
         ESTILOS
    ========================== -->

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #1b1b1b 0%,
                    #0b0b0b 48%,
                    #050505 100%
                );

            color: #ffffff;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }


        .payment-container {

            width: 100%;

            max-width: 520px;
        }


        .brand {

            text-align: center;

            margin-bottom: 30px;
        }


        .brand-name {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 22px;

            font-weight: 600;

            letter-spacing: 4px;
        }


        .brand-subtitle {

            margin-top: 8px;

            font-size: 12px;

            color: #8e8e8e;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }


        .payment-card {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.045
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter:
                blur(12px);
        }


        .title {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 24px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .description {

            color: #a0a0a0;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 26px;
        }


        .order-info {

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            padding:
                18px 0;

            margin-bottom: 24px;
        }


        .info-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 12px;

            font-size: 14px;
        }


        .info-row:last-child {

            margin-bottom: 0;
        }


        .info-label {

            color: #8f8f8f;
        }


        .info-value {

            color: #ffffff;

            font-weight: 500;

            text-align: right;

            word-break: break-word;
        }


        .total-row {

            margin-top: 18px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }


        .total-label {

            font-size: 16px;

            font-weight: 500;
        }


        .total-value {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 28px;

            font-weight: 700;
        }


        /* =========================
           PAYMENT BRICK
        ========================== */

        .brick-section {

            margin-top: 24px;

            padding-top: 24px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );
        }


        .brick-title {

            font-family:
                "Montserrat",
                Arial,
                sans-serif;

            font-size: 17px;

            font-weight: 600;

            margin-bottom: 16px;
        }


        #paymentBrick_container {

            width: 100%;
        }


        .back-button {

            width: 100%;

            margin-top: 18px;

            padding:
                13px
                18px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 12px;

            background:
                transparent;

            color: #bdbdbd;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 14px;

            cursor: pointer;
        }


        .back-button:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );
        }


        /* =========================
           REINTENTAR PAGO
        ========================== */

        .retry-button {

            width: 100%;

            margin-top: 18px;

            padding:
                14px
                18px;

            border:
                none;

            border-radius: 12px;

            background:
                #ffffff;

            color:
                #111111;

            font-family:
                "Inter",
                Arial,
                sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            display: none;
        }


        .retry-button:hover {

            background:
                #e8e8e8;
        }


        .retry-button.visible {

            display: block;
        }


        .status {

            margin-top: 20px;

            padding:
                13px
                14px;

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            color: #a8a8a8;

            font-size: 13px;

            line-height: 1.45;

            text-align: center;

            display: none;
        }


        .status.visible {

            display: block;
        }


        .status.error {

            color: #ff8d8d;

            border:
                1px solid
                rgba(
                    255,
                    80,
                    80,
                    0.15
                );
        }


        .status.success {

            color: #a8e6b0;

            border:
                1px solid
                rgba(
                    80,
                    200,
                    100,
                    0.15
                );
        }


        .loading {

            text-align: center;

            padding:
                24px 0;

            color: #999999;

            font-size: 14px;
        }


        .security-note {

            margin-top: 20px;

            text-align: center;

            color: #666666;

            font-size: 11px;

            line-height: 1.5;
        }


        @media (
            max-width: 480px
        ) {

            body {

                padding: 16px;
            }


            .payment-card {

                padding: 22px;
            }


            .title {

                font-size: 21px;
            }


            .total-value {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <main class="payment-container">


        <div class="brand">

            <div class="brand-name">
                NOVA MOMENTS
            </div>

            <div class="brand-subtitle">
                Pago seguro
            </div>

        </div>


        <section class="payment-card">


            <h1 class="title">
                Confirmar pedido
            </h1>


            <p class="description">
                Revisá el pedido antes de elegir
                el medio de pago.
            </p>


            <div
                id="loading"
                class="loading"
            >
                Cargando pedido...
            </div>


            <div
                id="contenido"
                style="display:none;"
            >


                <!-- =========================
                     INFORMACIÓN DEL PEDIDO
                ========================== -->

                <div class="order-info">


                    <div class="info-row">

                        <span class="info-label">
                            Pedido
                        </span>

                        <span
                            id="pedidoId"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Evento
                        </span>

                        <span
                            id="eventoId"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Cliente
                        </span>

                        <span
                            id="cliente"
                            class="info-value"
                        >
                        </span>

                    </div>


                    <div class="total-row">

                        <span class="total-label">
                            Total
                        </span>

                        <span
                            id="total"
                            class="total-value"
                        >
                        </span>

                    </div>


                </div>


                <!-- =========================
                     PAYMENT BRICK
                ========================== -->

                <div class="brick-section">

                    <div class="brick-title">
                        Elegí cómo pagar
                    </div>


                    <div
                        id="paymentBrick_container"
                    >
                    </div>

                </div>


                <!-- =========================
                     REINTENTAR PAGO
                ========================== -->

                <button
                    id="retryButton"
                    class="retry-button"
                    type="button"
                >
                    REINTENTAR PAGO
                </button>


                <!-- =========================
                     VOLVER
                ========================== -->

                <button
                    id="backButton"
                    class="back-button"
                    type="button"
                >
                    VOLVER
                </button>


                <!-- =========================
                     ESTADO
                ========================== -->

                <div
                    id="status"
                    class="status"
                >
                </div>


                <div class="security-note">

                    Pago procesado de forma segura
                    por Mercado Pago.

                </div>


            </div>


        </section>


    </main>


    <script>


        // =========================
        // ELEMENTOS
        // =========================

        const loading =
            document.getElementById(
                "loading"
            );

        const contenido =
            document.getElementById(
                "contenido"
            );

        const pedidoIdElement =
            document.getElementById(
                "pedidoId"
            );

        const eventoIdElement =
            document.getElementById(
                "eventoId"
            );

        const clienteElement =
            document.getElementById(
                "cliente"
            );

        const totalElement =
            document.getElementById(
                "total"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const retryButton =
            document.getElementById(
                "retryButton"
            );

        const status =
            document.getElementById(
                "status"
            );


        // =========================
        // OBTENER PEDIDO DE LA URL
        // =========================

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const pedidoId =
            (
                parametros.get(
                    "pedido"
                ) || ""
            ).trim();

        const origen =
            parametros.get("origen") || "";

        const experienciaOrigen =
            origen === "venta"
                ? "experiencia-venta.html"
                : "experiencia.html";


        // =========================
        // CONFIGURACIÓN MERCADO PAGO
        // =========================

        const publicKey =
            "APP_USR-a243ee1b-11f9-45ae-b390-a089e936f4ee";


        let paymentBrickController =
            null;


        // =========================
        // NUEVO:
        // CONTROLAR SI EL PAGO FUE APROBADO
        // =========================

        let pagoAprobado =
            false;


        // =========================
        // FORMATEAR DINERO
        // =========================

        function formatearPesos(
            valor
        ) {

            return new Intl.NumberFormat(
                "es-AR",
                {
                    style: "currency",
                    currency: "ARS",
                    maximumFractionDigits: 0
                }
            ).format(
                Number(valor)
            );

        }


        // =========================
        // MOSTRAR ERROR
        // =========================

        function mostrarError(
            mensaje
        ) {

            loading.style.display =
                "none";

            contenido.style.display =
                "block";

            status.textContent =
                mensaje;

            status.classList.add(
                "visible",
                "error"
            );

            status.classList.remove(
                "success"
            );

        }


        // =========================
        // MOSTRAR ESTADO
        // =========================

        function mostrarEstado(
            mensaje
        ) {

            status.textContent =
                mensaje;

            status.classList.add(
                "visible"
            );

            status.classList.remove(
                "error",
                "success"
            );

        }


        // =========================
        // MOSTRAR ÉXITO
        // =========================

        function mostrarExito(
            mensaje
        ) {

            status.textContent =
                mensaje;

            status.classList.add(
                "visible",
                "success"
            );

            status.classList.remove(
                "error"
            );

        }


        // =========================
        // CARGAR PEDIDO Y BRICK
        // =========================


        async function consultarEstadoPedido(
            intentos = 8,
            espera = 1500
        ) {
            for (let intento = 1; intento <= intentos; intento++) {
                try {
                    const respuesta = await fetch(
                        "/api/estado-pedido",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                pedido_id: pedidoId
                            })
                        }
                    );

                    const resultado = await respuesta.json();

                    console.log("Estado real del pedido:", resultado);

                    if (
                        resultado &&
                        resultado.estado_pago === "approved"
                    ) {
                        pagoAprobado = true;
                        mostrarExito(
                            "¡Pago aprobado! Tu pedido fue procesado correctamente."
                        );
                        return true;
                    }
                } catch (error) {
                    console.warn(
                        "No se pudo consultar el estado del pedido:",
                        error
                    );
                }

                if (intento < intentos) {
                    await new Promise(
                        resolve => setTimeout(resolve, espera)
                    );
                }
            }

            return false;
        }

        async function cargarPago() {

            if (!pedidoId) {

                mostrarError(
                    "No se indicó ningún pedido."
                );

                return;
            }


            try {

                // =========================
                // CREAR PREFERENCIA
                // =========================

                const respuesta =
                    await fetch(
                        "/api/crear-pago",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    pedido_id:
                                        pedidoId

                                })

                        }
                    );


                const datos =
                    await respuesta.json();


                if (
                    !respuesta.ok ||
                    !datos.ok
                ) {

                    throw new Error(
                        datos.error ||
                        "No se pudo preparar el pago."
                    );

                }


                // =========================
                // MOSTRAR INFORMACIÓN
                // =========================

                pedidoIdElement.textContent =
                    datos.pedido_id ||
                    pedidoId;


                eventoIdElement.textContent =
                    datos.evento_id ||
                    "NOVA MOMENTS";


                clienteElement.textContent =
                    "Pedido confirmado";


                totalElement.textContent =
                    formatearPesos(
                        datos.total
                    );


                // =========================
                // MOSTRAR CONTENIDO
                // =========================

                loading.style.display =
                    "none";

                contenido.style.display =
                    "block";


                // =========================
                // VERIFICAR PREFERENCE ID
                // =========================

                if (!datos.preference_id) {

                    throw new Error(
                        "Mercado Pago no devolvió el identificador de la preferencia."
                    );

                }


                // =========================
                // INICIALIZAR MERCADO PAGO
                // =========================

                const mp =
                    new MercadoPago(
                        publicKey
                    );


                const bricksBuilder =
                    mp.bricks();


                // =========================
                // CONFIGURACIÓN DEL PAYMENT BRICK
                // =========================

                const settings = {

                    initialization: {

                        amount:
                            Number(
                                datos.total
                            ),

                        preferenceId:
                            datos.preference_id

                    },


                    customization: {

                        paymentMethods: {

                            ticket:
                                "all",

                            creditCard:
                                "all",

                            prepaidCard:
                                "all",

                            debitCard:
                                "all",

                            mercadoPago:
                                "all"

                        }

                    },


                    callbacks: {

                        onReady:
                            () => {

                                console.log(
                                    "Payment Brick listo."
                                );

                            },


                        onSubmit:
                            async (
                                {
                                    selectedPaymentMethod,
                                    formData
                                }
                            ) => {

                                console.log(
                                    "Método seleccionado:",
                                    selectedPaymentMethod
                                );

                                console.log(
                                    "Datos del Brick:",
                                    formData
                                );


                                // =========================
                                // OCULTAR REINTENTO
                                // =========================

                                retryButton.classList.remove(
                                    "visible"
                                );


                                // =========================
                                // AVISAR AL USUARIO
                                // =========================

                                mostrarEstado(
                                    "Procesando el pago..."
                                );


                                try {

                                    // =========================
                                    // ENVIAR PAGO AL BACKEND
                                    // =========================

                                    const respuestaPago =
                                        await fetch(
                                            "/api/procesar-pago",
                                            {

                                                method:
                                                    "POST",

                                                headers: {

                                                    "Content-Type":
                                                        "application/json"

                                                },

                                                body:
                                                    JSON.stringify({

                                                        pedido_id:
                                                            pedidoId,

                                                        selectedPaymentMethod:
                                                            selectedPaymentMethod,

                                                        formData:
                                                            formData

                                                    })

                                            }
                                        );


                                    const resultadoPago =
                                        await respuestaPago.json();


                                    console.log(
                                        "Respuesta del procesamiento:",
                                        resultadoPago
                                    );

                                    // Mercado Pago puede completar la aprobación
                                    // desde su aplicación después de esta respuesta.
                                    // D1 es la fuente de verdad.
                                    if (
                                        resultadoPago.status !== "approved"
                                    ) {
                                        mostrarEstado(
                                            "Esperando confirmación del pago..."
                                        );

                                        const aprobadoEnD1 =
                                            await consultarEstadoPedido();

                                        if (aprobadoEnD1) {
                                            return;
                                        }
                                    }


                                    // =========================
                                    // ERROR DEL BACKEND
                                    // =========================

                                    if (
                                        !respuestaPago.ok ||
                                        !resultadoPago.ok
                                    ) {

                                        throw new Error(
                                            resultadoPago.error ||
                                            "Mercado Pago no pudo procesar el pago."
                                        );

                                    }


                                    // =========================
                                    // PAGO APROBADO
                                    // =========================

                                    if (
                                        resultadoPago.status ===
                                        "approved"
                                    ) {

                                        // =========================
                                        // MARCAR PAGO APROBADO
                                        // =========================

                                        pagoAprobado =
                                            true;


                                        mostrarExito(
                                            "¡Pago aprobado! Tu pedido fue procesado correctamente."
                                        );


                                        console.log(
                                            "Pago aprobado:",
                                            resultadoPago
                                        );


                                        return;

                                    }


                                    // =========================
                                    // PAGO RECHAZADO
                                    // =========================

                                    if (
                                        resultadoPago.status ===
                                        "rejected"
                                    ) {

                                        mostrarError(
                                            "El pago fue rechazado por Mercado Pago. Revisá los datos e intentá nuevamente."
                                        );


                                        // =========================
                                        // MOSTRAR REINTENTAR
                                        // =========================

                                        retryButton.classList.add(
                                            "visible"
                                        );


                                        console.warn(
                                            "Pago rechazado:",
                                            resultadoPago
                                        );


                                        return;

                                    }


                                    // =========================
                                    // OTRO ESTADO
                                    // =========================

                                    mostrarEstado(
                                        "El pago fue recibido y quedó pendiente de confirmación."
                                    );


                                    console.log(
                                        "Pago pendiente:",
                                        resultadoPago
                                    );

                                } catch (
                                    error
                                ) {

                                    console.error(
                                        "Error procesando pago:",
                                        error
                                    );


                                    mostrarError(
                                        error.message ||
                                        "No se pudo procesar el pago."
                                    );

                                }

                            },


                        onError:
                            (error) => {

                                console.error(
                                    "Error Payment Brick:",
                                    error
                                );


                                mostrarError(
                                    "No se pudo cargar correctamente el formulario de pago."
                                );

                            }

                    }

                };


                // =========================
                // CREAR PAYMENT BRICK
                // =========================

                paymentBrickController =
                    await bricksBuilder.create(
                        "payment",
                        "paymentBrick_container",
                        settings
                    );


            } catch (error) {

                console.error(
                    "Error preparando pago:",
                    error
                );


                mostrarError(
                    error.message ||
                    "No se pudo preparar el pago."
                );

            }

        }


        // =========================
        // REINTENTAR PAGO
        // =========================

        retryButton.addEventListener(
            "click",
            function () {

                window.location.href =
                    `pago.html?pedido=${encodeURIComponent(
                        pedidoId
                    )}`;

            }
        );


        // =========================
        // VOLVER
        // =========================

        backButton.addEventListener(
            "click",
            async function () {

                if (
                    paymentBrickController
                ) {

                    try {

                        paymentBrickController
                            .unmount();

                    } catch (error) {

                        console.warn(
                            "No se pudo desmontar Payment Brick:",
                            error
                        );

                    }

                }


                // Última comprobación al volver de Mercado Pago.
                if (!pagoAprobado) {
                    await consultarEstadoPedido(
                        3,
                        1000
                    );
                }

                // =========================
                // SI EL PAGO FUE APROBADO
                // VOLVER EXPLÍCITAMENTE A VENTA
                // =========================

                if (
                    pagoAprobado
                ) {

                    window.location.href =
                        `experiencia-venta.html?pago=approved&pedido=${encodeURIComponent(
                            pedidoId
                        )}`;

                    return;

                }


                // =========================
                // COMPORTAMIENTO NORMAL
                // =========================

                if (
                    document.referrer &&
                    document.referrer.includes(
                        window.location.origin
                    )
                ) {

                    window.history.back();

                } else {

                    window.location.href =
                        `${experienciaOrigen}?pedido=${encodeURIComponent(
                            pedidoId
                        )}`;

                }

            }
        );


        // =========================
        // LIMPIAR BRICK AL SALIR
        // =========================

        window.addEventListener(
            "beforeunload",
            function () {

                if (
                    paymentBrickController
                ) {

                    try {

                        paymentBrickController
                            .unmount();

                    } catch (error) {

                        console.warn(
                            "Error desmontando Payment Brick:",
                            error
                        );

                    }

                }

            }
        );


        async function verificarAlRegresar() {
            if (!pedidoId || pagoAprobado) {
                return;
            }

            console.log(
                "NOVA recuperó el foco. Verificando estado del pedido..."
            );

            await consultarEstadoPedido();
        }

        document.addEventListener(
            "visibilitychange",
            function () {
                if (
                    document.visibilityState === "visible"
                ) {
                    verificarAlRegresar();
                }
            }
        );

        window.addEventListener(
            "pageshow",
            function () {
                verificarAlRegresar();
            }
        );


        // =========================
        // INICIAR
        // =========================

        cargarPago();


    </script>


</body>

</html>
