<!-- =========================================
     CARGAR BASE DE DATOS
========================================= -->

<script src="js/clientes.js?v=3"></script>



<script>

/*
====================================================
SISTEMA DE ACCESO
====================================================
*/


const formulario =
    document.getElementById(
        "accessForm"
    );


const usuarioInput =
    document.getElementById(
        "usuario"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const error =
    document.getElementById(
        "error"
    );



formulario.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const usuario =
            usuarioInput.value
            .trim()
            .toLowerCase();


        const password =
            passwordInput.value
            .trim();



        /*
        ============================================
        VERIFICAR BASE DE DATOS
        ============================================
        */

        if (
            typeof USUARIOS ===
            "undefined"
        ) {

            mostrarError(
                "No se pudo cargar clientes.js."
            );

            return;

        }



        if (
            typeof EVENTOS ===
            "undefined"
        ) {

            mostrarError(
                "No se pudo cargar la base de eventos."
            );

            return;

        }



        /*
        ============================================
        BUSCAR USUARIO
        ============================================
        */

        const datos =
            USUARIOS[usuario];



        if (!datos) {

            mostrarError(
                "Usuario o contraseña incorrectos."
            );

            return;

        }



        /*
        ============================================
        COMPROBAR CONTRASEÑA
        ============================================
        */

        if (
            datos.password !== password
        ) {

            mostrarError(
                "Usuario o contraseña incorrectos."
            );

            return;

        }



        /*
        ============================================
        COMPROBAR EVENTO
        ============================================
        */

        if (
            !EVENTOS[datos.evento]
        ) {

            mostrarError(
                "La experiencia asociada a este usuario no existe."
            );

            return;

        }



        /*
        ============================================
        GUARDAR SESIÓN
        ============================================
        */

        sessionStorage.setItem(
            "nova_usuario",
            usuario
        );


        sessionStorage.setItem(
            "nova_evento",
            datos.evento
        );



        /*
        ============================================
        ENTRAR
        ============================================
        */

        window.location.href =
            "experiencia.html";

    }
);



function mostrarError(mensaje) {

    error.textContent =
        mensaje;

    error.style.display =
        "block";

}

</script>
